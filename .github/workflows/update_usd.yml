# Path in repo: .github/workflows/update_usd.yml
#
# Runs update_usd_rate.py once a day, BEFORE collect.yml (gold), so that
# gold_data_collector.py can read a fresh real USD/MMK rate from
# usd_history.csv the same day. Commits usd_history.csv if it changed.

name: Update USD/MMK black market rate

on:
  schedule:
    - cron: "0 2 * * *"      # 30 min before collect.yml's "30 2 * * *"
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-usd-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch today's real black-market rate
        run: python update_usd_rate.py --csv usd_history.csv

      - name: Commit if changed
        run: |
          git config user.name "usd-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet usd_history.csv; then
            git add usd_history.csv
            git commit -m "Update USD/MMK black market rate $(date -u +%F)"
            git push
          else
            echo "No change to usd_history.csv"
          fi
