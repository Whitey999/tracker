# Drop this file into .github/workflows/update_usd.yml in your repo.
#
# Runs update_usd_rate.py once a day, and commits usd_history.csv if the
# real scraped rate changed. Adjust the cron time to whenever you want
# it to run (currently 03:00 UTC ≈ late morning Myanmar time).

name: Update USD/MMK black market rate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update-usd-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch today's real black-market rate
        run: python pipeline/update_usd_rate.py --csv usd_history.csv

      - name: Commit if changed
        run: |
          git config user.name "usd-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet usd_history.csv; then
            git add usd_history.csv
            git commit -m "Update USD/MMK black market rate $(date -u +%F)"
            git push
          else
            echo "No change to usd_history.csv"
          fi
